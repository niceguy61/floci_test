<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudFormation Playground</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #fff;
        --line: #dce4f0;
        --text: #16202a;
        --muted: #5f6f7f;
        --accent: #155eef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #eef4fb 0%, #fafcff 100%);
        color: var(--text);
      }
      .page { max-width: 1180px; margin: 0 auto; padding: 24px; }
      .hero h1 { margin: 0 0 8px; font-size: 34px; }
      .hero p { margin: 0 0 24px; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: 360px 1fr 320px;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 24px rgba(20, 31, 54, 0.05);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      input, button { font: inherit; }
      input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .item {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
        background: #fbfdff;
      }
      .item h3 { margin: 0 0 6px; font-size: 16px; }
      .item p { margin: 0; color: var(--muted); font-size: 14px; }
      pre {
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: #f4f7fb;
        overflow: auto;
        font-size: 13px;
      }
      .status { min-height: 24px; color: var(--muted); font-size: 14px; }
      @media (max-width: 1100px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>CloudFormation Playground</h1>
        <p>간단한 S3 bucket 템플릿을 CloudFormation으로 배포하고 상태를 확인하는 예제입니다.</p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>스택 생성</h2>
          <form id="stack-form">
            <label class="field">
              <span>스택 이름</span>
              <input id="stackName" required />
            </label>
            <label class="field">
              <span>버킷 이름</span>
              <input id="bucketName" required />
            </label>
            <button type="submit">스택 생성</button>
            <div id="status" class="status"></div>
          </form>
        </article>

        <article class="card">
          <h2>현재 스택</h2>
          <div id="items"></div>
        </article>

        <article class="card">
          <h2>상세 조회</h2>
          <pre id="detail">{}</pre>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("stack-form");
      const statusNode = document.getElementById("status");
      const itemsNode = document.getElementById("items");
      const detailNode = document.getElementById("detail");

      async function request(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "request_failed");
        }
        return data;
      }

      async function refresh() {
        const data = await request("/api/stacks");
        itemsNode.innerHTML = "";
        if (!data.items.length) {
          itemsNode.innerHTML = '<div class="status">스택이 아직 없습니다.</div>';
          return;
        }
        data.items.forEach((item) => {
          const node = document.createElement("button");
          node.type = "button";
          node.className = "item";
          node.innerHTML = `
            <h3>${item.stackName}</h3>
            <p>${item.stackStatus}</p>
          `;
          node.addEventListener("click", async () => {
            const detail = await request(`/api/stacks/${encodeURIComponent(item.stackName)}`);
            detailNode.textContent = JSON.stringify(detail, null, 2);
          });
          itemsNode.append(node);
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = {
          stackName: document.getElementById("stackName").value.trim(),
          bucketName: document.getElementById("bucketName").value.trim()
        };
        statusNode.textContent = "스택 생성 중입니다...";

        try {
          await request("/api/stacks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          form.reset();
          statusNode.textContent = "스택 생성 요청이 들어갔습니다.";
          await refresh();
        } catch (error) {
          statusNode.textContent = error.message || "스택 생성 실패";
        }
      });

      refresh().catch(() => {});
      setInterval(() => refresh().catch(() => {}), 2000);
    </script>
  </body>
</html>
