<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Gallery Hands-on</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --line: #d8e2ef;
        --text: #16202a;
        --muted: #5f6b7a;
        --accent: #1473e6;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #eef4fb 0%, #f9fbfd 100%);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 34px;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .hero code {
        background: #eaf1fb;
        border-radius: 6px;
        padding: 2px 8px;
      }

      .grid {
        display: grid;
        grid-template-columns: 360px 1fr 320px;
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 28px rgba(19, 34, 62, 0.05);
      }

      .card h2 {
        margin-top: 0;
        font-size: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      .field input,
      .field textarea,
      .field button {
        font: inherit;
      }

      .field input,
      .field textarea {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }

      .field textarea {
        min-height: 88px;
        resize: vertical;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        min-height: 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .status.error {
        color: var(--danger);
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }

      .gallery-item {
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: #fbfdff;
        cursor: pointer;
      }

      .gallery-item img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #edf2f8;
      }

      .gallery-item .body {
        padding: 12px;
      }

      .gallery-item h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .gallery-item p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .detail img {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #edf2f8;
        margin-bottom: 14px;
      }

      .meta {
        display: grid;
        gap: 8px;
        font-size: 14px;
      }

      .meta code {
        background: #f0f5fb;
        border-radius: 6px;
        padding: 2px 6px;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>Image Gallery Hands-on</h1>
        <p>
          이 예제는 <code>S3 + DynamoDB</code> 조합을 <code>floci endpoint=http://localhost:4566</code> 기준으로 체험하는 첫 번째 핸즈온입니다.
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>업로드</h2>
          <form id="upload-form">
            <label class="field">
              <span>제목</span>
              <input id="title" name="title" required />
            </label>
            <label class="field">
              <span>설명</span>
              <textarea id="description" name="description"></textarea>
            </label>
            <label class="field">
              <span>이미지 파일</span>
              <input id="file" name="file" type="file" accept="image/*" required />
            </label>
            <div class="field">
              <button id="submit-button" type="submit">업로드</button>
            </div>
            <div id="status" class="status"></div>
          </form>
        </article>

        <article class="card">
          <h2>갤러리 목록</h2>
          <div id="gallery" class="gallery"></div>
        </article>

        <article class="card detail">
          <h2>선택한 이미지</h2>
          <div id="detail" class="empty">왼쪽 목록에서 이미지를 선택하세요.</div>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("upload-form");
      const statusNode = document.getElementById("status");
      const galleryNode = document.getElementById("gallery");
      const detailNode = document.getElementById("detail");
      const submitButton = document.getElementById("submit-button");

      function setStatus(message, isError = false) {
        statusNode.textContent = message;
        statusNode.className = isError ? "status error" : "status";
      }

      async function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const [, base64] = String(dataUrl).split(",");
            resolve(base64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function renderDetail(item) {
        detailNode.innerHTML = "";
        const image = document.createElement("img");
        image.src = item.imageUrl;
        image.alt = item.title;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `
          <strong>${item.title}</strong>
          <span>${item.description || "설명 없음"}</span>
          <span>파일명: <code>${item.filename}</code></span>
          <span>업로드 시각: <code>${item.uploadedAt}</code></span>
          <span>S3 Key: <code>${item.s3Key}</code></span>
        `;

        detailNode.append(image, meta);
      }

      function renderGallery(items) {
        galleryNode.innerHTML = "";

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "업로드된 이미지가 아직 없습니다.";
          galleryNode.append(empty);
          detailNode.innerHTML = '<div class="empty">왼쪽 목록에서 이미지를 선택하세요.</div>';
          return;
        }

        items.forEach((item, index) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "gallery-item";
          card.innerHTML = `
            <img src="${item.imageUrl}" alt="${item.title}" />
            <div class="body">
              <h3>${item.title}</h3>
              <p>${item.description || "설명 없음"}</p>
            </div>
          `;
          card.addEventListener("click", () => renderDetail(item));
          galleryNode.append(card);

          if (index === 0) {
            renderDetail(item);
          }
        });
      }

      async function loadImages() {
        const response = await fetch("/api/images");
        if (!response.ok) {
          throw new Error("목록을 불러오지 못했습니다.");
        }
        const data = await response.json();
        renderGallery(data.items || []);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        setStatus("업로드 중입니다...");

        try {
          const file = document.getElementById("file").files[0];
          if (!file) {
            throw new Error("이미지 파일을 선택하세요.");
          }

          const payload = {
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            filename: file.name,
            contentType: file.type || "application/octet-stream",
            dataBase64: await fileToBase64(file)
          };

          const response = await fetch("/api/images", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "업로드에 실패했습니다.");
          }

          form.reset();
          setStatus("업로드가 완료되었습니다.");
          await loadImages();
        } catch (error) {
          setStatus(error.message || "업로드에 실패했습니다.", true);
        } finally {
          submitButton.disabled = false;
        }
      });

      loadImages().catch((error) => {
        setStatus(error.message || "목록을 불러오지 못했습니다.", true);
      });
    </script>
  </body>
</html>
