<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Logs Hands-on</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #fff;
        --line: #dce4f0;
        --text: #17212b;
        --muted: #617180;
        --accent: #175cd3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #eef4fb 0%, #fafcff 100%);
        color: var(--text);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero h1 { margin: 0 0 8px; font-size: 34px; }
      .hero p { color: var(--muted); margin: 0 0 24px; }
      .grid {
        display: grid;
        grid-template-columns: 360px 1fr 320px;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 24px rgba(20, 31, 54, 0.05);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      input, button { font: inherit; }
      input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .item {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
        background: #fbfdff;
      }
      .item h3 { margin: 0 0 6px; font-size: 16px; }
      .item p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
      .empty { color: var(--muted); font-size: 14px; }
      pre {
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: #f3f7fb;
        overflow: auto;
        font-size: 13px;
      }
      @media (max-width: 1000px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>Todo + CloudWatch Logs Hands-on</h1>
        <p>DynamoDB에 할 일을 저장하고 상태 변경을 CloudWatch Logs로 남기는 예제입니다.</p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>할 일 추가</h2>
          <form id="todo-form">
            <label class="field">
              <span>제목</span>
              <input id="title" required />
            </label>
            <button type="submit">할 일 생성</button>
          </form>
        </article>

        <article class="card">
          <h2>할 일 목록</h2>
          <div id="todos"></div>
        </article>

        <article class="card">
          <h2>최근 로그</h2>
          <pre id="logs">[]</pre>
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("todo-form");
      const todosNode = document.getElementById("todos");
      const logsNode = document.getElementById("logs");

      async function request(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "request_failed");
        }
        return data;
      }

      async function refresh() {
        const [todos, logs] = await Promise.all([
          request("/api/todos"),
          request("/api/logs")
        ]);

        todosNode.innerHTML = "";
        if (!todos.items.length) {
          todosNode.innerHTML = '<div class="empty">할 일이 아직 없습니다.</div>';
        } else {
          todos.items.forEach((item) => {
            const node = document.createElement("div");
            node.className = "item";
            node.innerHTML = `
              <h3>${item.title}</h3>
              <p>${item.completed ? "완료됨" : "진행중"}</p>
            `;
            const button = document.createElement("button");
            button.textContent = "완료 토글";
            button.addEventListener("click", async () => {
              await request(`/api/todos/${item.id}/toggle`, { method: "POST" });
              await refresh();
            });
            node.append(button);
            todosNode.append(node);
          });
        }

        logsNode.textContent = JSON.stringify(logs.items, null, 2);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = document.getElementById("title").value.trim();
        if (!title) return;
        await request("/api/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title })
        });
        form.reset();
        await refresh();
      });

      refresh().catch(() => {});
      setInterval(() => refresh().catch(() => {}), 2000);
    </script>
  </body>
</html>
