server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hands-on-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: hands-on-app-logs
          app: auth-portal
          __path__: /workspace-apps/auth-portal/.runtime/*.log
      - targets:
          - localhost
        labels:
          job: hands-on-app-logs
          app: secret-vault
          __path__: /workspace-apps/secret-vault/.runtime/*.log
      - targets:
          - localhost
        labels:
          job: hands-on-app-logs
          app: feature-flags
          __path__: /workspace-apps/feature-flags/.runtime/*.log
      - targets:
          - localhost
        labels:
          job: hands-on-app-logs
          app: todo-logs
          __path__: /workspace-apps/todo-logs/.runtime/*.log
      - targets:
          - localhost
        labels:
          job: hands-on-app-logs
          app: product-catalog-cache
          __path__: /workspace-apps/product-catalog-cache/.runtime/*.log
