<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Floci, LocalStack, and AWS comparison diagram</title>
  <desc id="desc">A visual comparison showing floci and LocalStack as local emulators in front of actual AWS managed services.</desc>
  <defs>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefcf8"/>
      <stop offset="100%" stop-color="#d9f7ef"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f5ff"/>
      <stop offset="100%" stop-color="#e8ebff"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#ffeedb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fbfcfe"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16202a">Local AWS Emulator Landscape</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#5b6472">Floci and LocalStack emulate AWS-facing workflows locally, while AWS runs the real managed services.</text>

  <rect x="60" y="130" width="250" height="330" rx="24" fill="url(#panelA)" stroke="#7ad8bd" stroke-width="3"/>
  <text x="185" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">Floci</text>
  <text x="185" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#23554c">No account, no token, single endpoint</text>
  <rect x="92" y="235" width="186" height="44" rx="12" fill="#ffffff" stroke="#9fe5d2"/>
  <text x="185" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#115e59">Runs in Docker</text>
  <rect x="92" y="292" width="186" height="44" rx="12" fill="#ffffff" stroke="#9fe5d2"/>
  <text x="185" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#115e59">AWS CLI / SDK compatible</text>
  <rect x="92" y="349" width="186" height="72" rx="12" fill="#ffffff" stroke="#9fe5d2"/>
  <text x="185" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#115e59">Best fit</text>
  <text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#23554c">Simple local practice</text>
  <text x="185" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#23554c">Low-friction CI / dev loops</text>

  <rect x="355" y="130" width="250" height="330" rx="24" fill="url(#panelB)" stroke="#98a6ff" stroke-width="3"/>
  <text x="480" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2f3aa6">LocalStack</text>
  <text x="480" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#404b8a">Broader ecosystem, richer tooling</text>
  <rect x="387" y="235" width="186" height="44" rx="12" fill="#ffffff" stroke="#b7c1ff"/>
  <text x="480" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2678">Runs locally or in CI</text>
  <rect x="387" y="292" width="186" height="44" rx="12" fill="#ffffff" stroke="#b7c1ff"/>
  <text x="480" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2678">CLI, UI, integrations</text>
  <rect x="387" y="349" width="186" height="72" rx="12" fill="#ffffff" stroke="#b7c1ff"/>
  <text x="480" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2678">Best fit</text>
  <text x="480" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#404b8a">Large docs footprint</text>
  <text x="480" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#404b8a">Deep tooling ecosystem</text>

  <rect x="650" y="130" width="250" height="330" rx="24" fill="url(#panelC)" stroke="#f0be87" stroke-width="3"/>
  <text x="775" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#232f3e">AWS</text>
  <text x="775" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7c5b34">Actual managed cloud services</text>
  <rect x="682" y="235" width="186" height="44" rx="12" fill="#ffffff" stroke="#f5d0a8"/>
  <text x="775" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#232f3e">Runs in AWS regions</text>
  <rect x="682" y="292" width="186" height="44" rx="12" fill="#ffffff" stroke="#f5d0a8"/>
  <text x="775" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#232f3e">Real IAM, VPC, billing</text>
  <rect x="682" y="349" width="186" height="72" rx="12" fill="#ffffff" stroke="#f5d0a8"/>
  <text x="775" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#232f3e">Best fit</text>
  <text x="775" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c5b34">Production behavior</text>
  <text x="775" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c5b34">Actual cloud operations</text>

  <path d="M312 270H350" fill="none" stroke="#5b6472" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M607 270H645" fill="none" stroke="#5b6472" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="477" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b6472">Same AWS-facing development flow, different execution model and operational reality.</text>
</svg>
