<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">LocalStack icon</title>
  <desc id="desc">A stylized localstack badge with stacked layers and the word LocalStack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f6ff"/>
      <stop offset="100%" stop-color="#e4e8ff"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b5df0"/>
      <stop offset="100%" stop-color="#2731b8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg)" stroke="#aeb7ff" stroke-width="4"/>
  <g fill="url(#stack)">
    <rect x="40" y="44" width="80" height="16" rx="8"/>
    <rect x="34" y="66" width="92" height="16" rx="8" opacity="0.92"/>
    <rect x="28" y="88" width="104" height="16" rx="8" opacity="0.84"/>
  </g>
  <text x="80" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e2678">LocalStack</text>
</svg>
